[package]
name = "freya-clipboard"
version = "0.5.0-rc.6"
edition = "2024"
description = "Clipboard integration for Freya."
license = "MIT"
authors = ["Marc Espín <mespinsanz@gmail.com>"]
homepage = "https://github.com/marc2332/freya"
repository = "https://github.com/marc2332/freya"
keywords = ["freya"]
categories = ["gui"]

[lints]
workspace = true

[dependencies]
freya-core = { workspace = true }

# Not on Android or the web: arboard has a backend for neither and fails to compile against its
# `platform` module. `ClipboardContext` is a context that never opens there instead.
#
# `wayland-data-control` so a Wayland session talks to the compositor directly instead of
# reaching XWayland for a clipboard; arboard falls back to X11 where the protocol is missing.
[target.'cfg(not(any(target_os = "android", target_family = "wasm")))'.dependencies]
arboard = { version = "3.6", features = ["wayland-data-control"] }

[dev-dependencies]
freya = { path = "../freya" }
