# Upstream uploads these profiles to its hotpath cloud project and relays PR reports through it.
# The fork has no such project, so it profiles head and base itself and uploads both reports.
name: Hotpath

on:
  pull_request:

jobs:
  hotpath:
    runs-on: ubuntu-latest
    concurrency:
      group: hotpath-${{ github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - name: Install just
        uses: taiki-e/install-action@80e6af7a2ec7f280fffe2d0a9d3a12a9d11d86e9 # v2.75.1
        with:
          tool: just
      - name: Install linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update && sudo apt install build-essential libssl-dev pkg-config libudev-dev libasound2-dev liblzma-dev libfontconfig1-dev libfreetype6-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libwayland-dev
      - name: Create metrics directory
        run: mkdir -p /tmp/metrics
      # Reports from different hotpath versions do not compare, so a PR that changes the hotpath
      # version profiles its head only.
      - name: Check the base uses the same hotpath
        id: base
        run: |
          hotpath_version() {
            git show "$1:Cargo.lock" | awk '/^name = "hotpath"$/ { getline; print $3 }'
          }
          head=$(hotpath_version ${{ github.event.pull_request.head.sha }})
          base=$(hotpath_version ${{ github.event.pull_request.base.sha }})
          if [ "$head" = "$base" ]; then
            echo "comparable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::hotpath changes from $base to $head, so there is no base to compare against"
            echo "comparable=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Head timing metrics
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/head_timing.json
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          just ps-ci
      - name: Base timing metrics
        if: steps.base.outputs.comparable == 'true'
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/base_timing.json
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          just ps-ci
      - name: Head alloc metrics
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/head_alloc.json
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          just pa-ci
      - name: Base alloc metrics
        if: steps.base.outputs.comparable == 'true'
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/base_alloc.json
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          just pa-ci
      - name: Head core metrics
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/head_core.json
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          just pc-ci
      - name: Base core metrics
        if: steps.base.outputs.comparable == 'true'
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/base_core.json
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          just pc-ci || echo "core_perf is not available in the base branch"
      # hotpath 0.32 compares reports only through its cloud service, which the fork does not
      # use, so the head and base reports are published for comparison instead.
      - name: Upload reports
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hotpath-reports
          path: /tmp/metrics/*.json
          retention-days: 7
          if-no-files-found: error
